kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
    extraMounts:
      - hostPath: /etc/ssl/certs
        containerPath: /etc/ssl/certs
      - hostPath: /etc/containerd/certs.d
        containerPath: /etc/containerd/certs.d
