apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azubi-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <dein-gitlab-repo-url>
    targetRevision: main
    path: gitops/apps/azubi-portal
    helm:
      valueFiles:
        - values-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: azubi-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
