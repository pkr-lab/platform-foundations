apiVersion: apps/v1
kind: Deployment
metadata:
  name: azubi-portal
  labels:
    app: azubi-portal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: azubi-portal
  template:
    metadata:
      labels:
        app: azubi-portal
    spec:
      containers:
        - name: azubi-portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: azubi-portal-html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: azubi-portal-html
          configMap:
            name: azubi-portal-html
