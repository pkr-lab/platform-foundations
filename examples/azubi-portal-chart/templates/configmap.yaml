{{- if .Values.htmlFromConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: azubi-portal-html
  labels:
    {{- include "azubi-portal.labels" . | nindent 4 }}
data:
  index.html: |
    <html>
      <head>
        <meta charset="utf-8">
        <title>Azubi-Portal</title>
      </head>
      <body>
        <h1>{{ .Values.welcomeMessage }}</h1>
        <p>Dies ist das statische Azubi-Portal für dein Kubernetes-Lab.</p>
      </body>
    </html>
{{- end }}
