replicaCount: 2

image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: "1.28.0"
  pullPolicy: IfNotPresent

containerPort: 8080

imagePullSecrets: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

welcomeMessage: "Willkommen im Azubi-Portal"

htmlFromConfigMap: true

existingSecret: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

ingress:
  enabled: false
  className: traefik
  host: azubi-portal.localhost
